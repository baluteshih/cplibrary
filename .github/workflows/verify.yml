name: verify

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5

    - name: Install dependencies
      run: |
        pip3 install -U online-judge-verify-helper
        pip3 install "setuptools<81" pyyaml
        git clone --depth 1 https://github.com/Task-Management-Tools/tmt-cli.git /tmp/tmt-cli
        echo "/tmp/tmt-cli" >> $GITHUB_PATH

    - name: Generate custom testcases
      run: python3 .verify-helper/generate_custom_tests.py

    - name: Run tests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
        GH_PAT: ${{ secrets.GH_PAT }}
      run: oj-verify all -j 2
